spring.config.import=optional:file:./.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/freelance_marketplace}
spring.data.mongodb.auto-index-creation=true

server.port=8080
jwt.secret=change-this-secret-key-for-production-please-use-a-strong-one
jwt.expiration-ms=86400000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=INFO
logging.level.com.freelance.marketplace=DEBUG

# Gui email (Gmail SMTP). Dat MAIL_USERNAME va MAIL_PASSWORD (App Password) trong server/.env hoac bien moi truong.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
